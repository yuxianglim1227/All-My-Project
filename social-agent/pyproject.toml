[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialagent"
version = "0.1.0"
description = "Creative Instagram + TikTok manager: send a photo/video, get it edited, captioned, scheduled and posted."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8",
  "python-telegram-bot>=21",
  "aiohttp>=3.9",
  "PyYAML>=6",
  "httpx>=0.27",
  "tzdata; sys_platform == 'win32'",  # Windows has no system time-zone database for zoneinfo
]

[project.optional-dependencies]
capcut = ["pyjianyingdraft>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
socialagent = "socialagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
socialagent = ["studio/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
